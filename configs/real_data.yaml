# Configuration for Real Aquaculture Dataset Training & Evaluation
dataset:
  name: "mendeley_aquaculture"
  target_column: "ph"
  physical_scaling: true
  sampling_frequency: "5min"
  resampling_method: "linear"

features:
  window_size: 20
  include_multisensor: true
  auxiliary_sensors:
    - "temperature"
    - "dissolved_oxygen"
    - "turbidity"
    - "salinity"

split:
  strategy: "chronological"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  shuffle: false

models:
  random_forest:
    n_estimators: 100
    max_depth: 12
    random_state: 42
    n_jobs: -1
  hist_gradient_boosting:
    random_state: 42
    max_iter: 100
  linear_regression:
    fit_intercept: true

horizons:
  - 1   # 5 minutes advance warning
  - 5   # 25 minutes advance warning
  - 15  # 75 minutes advance warning
  - 30  # 150 minutes (2.5 hours) advance warning

output:
  model_dir: "models/real"
  artifact_dir: "artifacts"
  version: "v2.0"
